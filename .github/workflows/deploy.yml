name: Deploy Git Blog + Portfolio Projects

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==================================================
      # 3. Build Portfolio Projects
      #
      # GitHub Pages 배포를 위해 실제 빌드가 필요한
      # Next.js 프로젝트만 명시적으로 관리합니다.
      #
      # Build Projects
      # - Portfolio/study/ai
      # - Portfolio/study/cs
      # - Portfolio/kms
      #
      # 신규 Build 프로젝트 추가 시
      # BUILD_PROJECTS 배열에 경로를 추가합니다.
      # ==================================================
      - name: Build Portfolio Projects
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PROJECTS=(
            "Portfolio/study/ai"
            "Portfolio/study/cs"
            "Portfolio/kms"
          )

          echo "=========================================="
          echo "Portfolio Build Projects"
          echo "=========================================="

          for project in "${BUILD_PROJECTS[@]}"; do
            echo ""
            echo "------------------------------------------"
            echo "[PROJECT]"
            echo "Path : $project"
            echo "------------------------------------------"

            # ------------------------------------------
            # 프로젝트 디렉터리 존재 확인
            # ------------------------------------------
            if [ ! -d "$project" ]; then
              echo "[ERROR] Project directory not found: $project"
              exit 1
            fi

            # ------------------------------------------
            # package.json 존재 확인
            # ------------------------------------------
            if [ ! -f "$project/package.json" ]; then
              echo "[ERROR] package.json not found: $project"
              exit 1
            fi

            pushd "$project" > /dev/null

            # ------------------------------------------
            # build script 존재 확인
            # ------------------------------------------
            if ! node -e '
              const p = require("./package.json");

              if (!p.scripts || !p.scripts.build) {
                process.exit(1);
              }
            '; then
              echo "[ERROR] build script not found: $project/package.json"
              popd > /dev/null
              exit 1
            fi

            # ------------------------------------------
            # Dependencies
            #
            # package-lock.json 존재 시 npm ci
            # 없으면 npm install
            # ------------------------------------------
            if [ -f "package-lock.json" ]; then
              echo "[INSTALL] npm ci"
              npm ci
            else
              echo "[INSTALL] npm install"
              npm install
            fi

            # ------------------------------------------
            # GitHub Pages Base Path
            #
            # Portfolio/study/ai
            # -> /Portfolio/study/ai
            #
            # Portfolio/study/cs
            # -> /Portfolio/study/cs
            #
            # Portfolio/kms
            # -> /Portfolio/kms
            # ------------------------------------------
            BASE_PATH="/${project}"

            echo "[INFO] BasePath: $BASE_PATH"

            # ------------------------------------------
            # Optional Content Validation
            #
            # validate script가 존재하는 프로젝트만 실행
            # KMS의 Markdown content 검증에도 사용됩니다.
            # ------------------------------------------
            if node -e '
              const p = require("./package.json");
              process.exit(
                p.scripts && p.scripts.validate ? 0 : 1
              );
            '; then
              echo "[VALIDATE] npm run validate"
              npm run validate
            else
              echo "[INFO] validate script not defined."
            fi

            # ------------------------------------------
            # Build
            # ------------------------------------------
            echo "[BUILD] npm run build"

            NEXT_PUBLIC_BASE_PATH="$BASE_PATH" \
              npm run build

            # ------------------------------------------
            # Static Export 결과 확인
            # ------------------------------------------
            if [ ! -d "out" ]; then
              echo ""
              echo "[ERROR] out/ directory was not created."
              echo "Project: $project"
              echo ""
              echo "GitHub Pages requires a static export."
              echo ""
              popd > /dev/null
              exit 1
            fi

            # ------------------------------------------
            # index.html 확인
            # ------------------------------------------
            if [ ! -f "out/index.html" ]; then
              echo ""
              echo "[ERROR] out/index.html was not created."
              echo "Project: $project"
              echo ""
              popd > /dev/null
              exit 1
            fi

            popd > /dev/null

            echo "[SUCCESS] Build completed: $project"
          done

      # ==================================================
      # 4. Configure GitHub Pages
      # ==================================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ==================================================
      # 5. Build Existing Jekyll Blog
      #
      # 기존 Git Blog을 _site에 빌드합니다.
      # Portfolio 프로젝트는 이후 별도로 병합합니다.
      # ==================================================
      - name: Build Jekyll Blog
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # ==================================================
      # 6. Prepare Final Site
      # ==================================================
      - name: Prepare Final Site
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Prepare Final Site"
          echo "=========================================="

          rm -rf ./_final_site
          mkdir -p ./_final_site

          echo "[COPY]"
          echo "./_site/"
          echo "   ↓"
          echo "./_final_site/"

          cp -a ./_site/. ./_final_site/

          echo "[SUCCESS] Jekyll site copied."

      # ==================================================
      # 7. Copy Static Portfolio
      #
      # Portfolio 전체를 우선 Static Source로 복사합니다.
      #
      # Build 프로젝트의 source는 이후
      # out/ 결과물로 교체됩니다.
      #
      # node_modules / .next / out 등은 제외합니다.
      # ==================================================
      - name: Copy Static Portfolio
        shell: bash
        run: |
          set -euo pipefail

          PORTFOLIO_ROOT="Portfolio"
          TARGET_ROOT="_final_site/Portfolio"

          echo "=========================================="
          echo "Copy Static Portfolio"
          echo "=========================================="

          if [ ! -d "$PORTFOLIO_ROOT" ]; then
            echo "[INFO] Portfolio directory not found."
            exit 0
          fi

          mkdir -p "$TARGET_ROOT"

          echo "[COPY]"
          echo "./Portfolio/"
          echo "   ↓"
          echo "./_final_site/Portfolio/"

          rsync -a \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='out/' \
            --exclude='.git/' \
            "$PORTFOLIO_ROOT/" \
            "$TARGET_ROOT/"

          echo "[SUCCESS] Static Portfolio copied."

      # ==================================================
      # 8. Merge Built Portfolio Projects
      #
      # Build 대상 프로젝트의 Source Directory를 제거하고
      # Next.js out/ 결과물로 교체합니다.
      #
      # Portfolio/kms/out/
      #       ↓
      # _final_site/Portfolio/kms/
      # ==================================================
      - name: Merge Built Portfolio Projects
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PROJECTS=(
            "Portfolio/study/ai"
            "Portfolio/study/cs"
            "Portfolio/kms"
          )

          echo "=========================================="
          echo "Merge Built Portfolio Projects"
          echo "=========================================="

          for project in "${BUILD_PROJECTS[@]}"; do
            OUTPUT_DIR="$project/out"
            TARGET_DIR="_final_site/$project"

            echo ""
            echo "------------------------------------------"
            echo "[MERGE]"
            echo "Source : $OUTPUT_DIR"
            echo "Target : $TARGET_DIR"
            echo "------------------------------------------"

            if [ ! -d "$OUTPUT_DIR" ]; then
              echo "[ERROR] Build output missing: $OUTPUT_DIR"
              exit 1
            fi

            if [ ! -f "$OUTPUT_DIR/index.html" ]; then
              echo "[ERROR] Build index missing:"
              echo "$OUTPUT_DIR/index.html"
              exit 1
            fi

            # ------------------------------------------
            # Static Source 제거
            # ------------------------------------------
            rm -rf "$TARGET_DIR"

            # ------------------------------------------
            # Build 결과 배치
            # ------------------------------------------
            mkdir -p "$TARGET_DIR"

            cp -a "$OUTPUT_DIR"/. "$TARGET_DIR"/

            echo "[SUCCESS] Merged: $project"
          done

      # ==================================================
      # 9. Validate Final Site
      #
      # 핵심 서비스가 최종 Artifact에서 누락되면
      # Deploy 전에 Build를 실패시킵니다.
      # ==================================================
      - name: Validate Final Site
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final Site Validation"
          echo "=========================================="

          if [ ! -d "./_final_site" ]; then
            echo "[ERROR] _final_site does not exist."
            exit 1
          fi

          # ------------------------------------------
          # 반드시 존재해야 하는 index.html
          # ------------------------------------------
          REQUIRED_FILES=(
            "_final_site/index.html"
            "_final_site/Portfolio/Game/Cheonryugwan-Archive/index.html"
            "_final_site/Portfolio/study/ai/index.html"
            "_final_site/Portfolio/study/cs/index.html"
            "_final_site/Portfolio/kms/index.html"
          )

          echo ""
          echo "[CHECK] Required files"
          echo ""

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Required file missing:"
              echo "$file"
              exit 1
            fi

            echo "[OK] $file"
          done

          # ------------------------------------------
          # KMS Build 결과 확인
          # ------------------------------------------
          KMS_ROOT="_final_site/Portfolio/kms"

          echo ""
          echo "[CHECK] KMS Career Portfolio"
          echo ""

          if [ ! -d "$KMS_ROOT" ]; then
            echo "[ERROR] KMS directory missing:"
            echo "$KMS_ROOT"
            exit 1
          fi

          if [ ! -f "$KMS_ROOT/index.html" ]; then
            echo "[ERROR] KMS index.html missing."
            exit 1
          fi

          echo "[OK] $KMS_ROOT"
          echo "[OK] $KMS_ROOT/index.html"

          # ------------------------------------------
          # Next.js Static Assets 확인
          # ------------------------------------------
          if [ ! -d "$KMS_ROOT/_next" ]; then
            echo "[ERROR] KMS Next.js static assets missing:"
            echo "$KMS_ROOT/_next"
            exit 1
          fi

          echo "[OK] $KMS_ROOT/_next"

          # ------------------------------------------
          # 천류관 주요 디렉터리 확인
          # ------------------------------------------
          CHEONRYUGWAN_ROOT="_final_site/Portfolio/Game/Cheonryugwan-Archive"

          REQUIRED_CHEONRYUGWAN_DIRS=(
            "$CHEONRYUGWAN_ROOT/assets"
            "$CHEONRYUGWAN_ROOT/data"
            "$CHEONRYUGWAN_ROOT/game"
            "$CHEONRYUGWAN_ROOT/pages"
          )

          echo ""
          echo "[CHECK] Cheonryugwan directories"
          echo ""

          for dir in "${REQUIRED_CHEONRYUGWAN_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "[ERROR] Required directory missing:"
              echo "$dir"
              exit 1
            fi

            echo "[OK] $dir"
          done

          # ------------------------------------------
          # Portfolio 배포 결과 출력
          # ------------------------------------------
          echo ""
          echo "[INFO] Portfolio index files:"
          echo ""

          find ./_final_site/Portfolio \
            -type f \
            -name "index.html" \
            | sort

          echo ""
          echo "=========================================="
          echo "[SUCCESS] Final Site Validation Completed"
          echo "=========================================="

      # ==================================================
      # 10. Upload GitHub Pages Artifact
      # ==================================================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_final_site

  # ======================================================
  # 11. Deploy GitHub Pages
  # ======================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4